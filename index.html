
<!DOCTYPE html>
<html>
<head>
<!-- devTempStyle.css was removed during cleanup -->
<meta charset="UTF-8">
<title>My Tower Defense</title>
<link rel="stylesheet" type="text/css" href="css/style.css">
<!--
Load core systems first, then editors, then main application.
-->
<script type="module" src="./js/core/GameState.js"></script>
<script type="module" src="./js/core/MovementSystem.js"></script>
<script type="module" src="./js/core/AssetManager.js"></script>
<script type="module" src="./js/router.js"></script>
<script type="module" src="./js/editors/editorHub.js"></script>
<script type="module" src="./js/mainScreen.js"></script>
<script type="module" src="./js/main.js"></script>
</head>
<body>
<!-- MAIN SCREEN -->
<div id="mainScreen">
<div id="slotButtonsContainer"></div>
<div id="currentSlotLabel"></div>
<div id="selectedHeroLabel"></div>

<!-- World Map Container -->
<div id="worldMapContainer" class="world-map-container">
  <!-- Level markers are created dynamically by JavaScript -->
</div>
</div>
<!-- BOTTOM-RIGHT Placeholders -->
<div id="bottomRightButtons" class="bottom-right-buttons">
<!-- Add "Level Editor" button above Tower Upgrades -->
<button id="levelEditorButton" class="placeholder-btn">Game Editor</button>

<button id="upgradeButton" class="placeholder-btn">Tower Upgrades</button>
<button id="heroesButton" class="placeholder-btn">Heroes</button>
<button id="itemsButton" class="placeholder-btn">Items</button>
<!-- New info section under Items button -->
<div id="updateInfo" class="update-info"></div>
</div>

<!-- Hero Selection Dialog (hidden) -->
<div id="heroDialog" class="hero-dialog">
<div id="heroDialogClose" class="dialog-close">&#10006;</div>
<h2>Select Your Hero</h2>
<div class="hero-choice">
<button id="meleeHeroBtn">Melee Hero</button>
</div>
<div class="hero-choice">
<button id="archerHeroBtn">Archer Hero</button>
</div>
</div>
</div>

<!-- The Editor Hub screen -->
<div id="editorHub">

<!--
New flex container at top:
- Left side: tab buttons
- Right side: "Back to Main"
-->
<div id="editorHubHeader" class="editor-hub-header">
<div class="editor-tab-buttons">
<button class="editor-tab-button" data-target="mapEditorTab">Map Editor</button>
<button class="editor-tab-button" data-target="levelEditorTab">Level Editor</button>
<button class="editor-tab-button" data-target="enemyEditorTab">Enemy Editor</button>
<button class="editor-tab-button" data-target="towerEditorTab">Tower Editor</button>
<button class="editor-tab-button" data-target="heroEditorTab">Hero Editor</button>
</div>
<button id="editorBackToMainBtn" class="btn">Back to Main</button>
</div>

<div id="mapEditorTab" class="editor-tab-content">
<!-- Map Editor content (populated dynamically) -->
</div>
<div id="levelEditorTab" class="editor-tab-content">
<!-- Level Editor content (populated dynamically) -->
</div>
<div id="enemyEditorTab" class="editor-tab-content">
<h2>Enemy Editor (Placeholder)</h2>
</div>
<div id="towerEditorTab" class="editor-tab-content">
<h2>Tower Editor (Placeholder)</h2>
</div>
<div id="heroEditorTab" class="editor-tab-content">
<h2>Hero Editor (Placeholder)</h2>
</div>
</div>

<!-- GAME SCREEN (hidden by default) -->
<div id="gameContainer" class="game-container">
<canvas id="gameCanvas" class="game-canvas" width="800" height="600"></canvas>

<div id="topButtons" class="top-buttons">
<button id="speedToggleButton" class="action-button">1x</button>
<button id="gameControlButton" class="action-button">Start</button>
<button id="settingsButton" class="action-button">&#9881;</button>
</div>
</div>

<!-- Enemy stats UI (bottom-left) -->
<div id="enemyStats" class="enemy-stats">
<img id="enemyImage" class="enemy-image" src="" alt="enemy">
<div><strong id="enemyName">Name</strong></div>
<div>HP: <span id="enemyHp"></span></div>
<div>Speed: <span id="enemySpeed"></span></div>
<div>Gold on Kill: <span id="enemyGold"></span></div>
</div>

<div id="towerSelectPanel" class="tower-select-panel">
</div>

<div id="settingsDialog" class="settings-dialog">
<div id="settingsDialogClose" class="dialog-close">&#10006;</div>
<h2 id="settingsHeading">Settings</h2>
<div id="settingsDialogContent" class="settings-dialog-content">
<!-- LEFT column -->
<div id="settingsLeftColumn" class="settings-left-column">
<div id="currentGameLabel" class="small-info-label"></div>
<button id="toggleDebugBtn" class="btn" style="margin: 5px 0;">Hide Debug</button>
<hr style="margin:6px 0;" />
<div id="enemyHpRow">
<label id="enemyHpLabel">Enemy HP</label>
<div id="enemyHpSegment"></div>
</div>
<div id="startingGoldRow">
<label id="startingGoldLabel" for="startingGoldInput">Starting gold</label>
<input type="number" id="startingGoldInput" value="1000" />
</div>
<button id="restartGameButton" class="action-button" style="margin-top: 10px;">
Restart Game
</button>
<!-- Back to Main button -->
<button id="backToMainButton" class="action-button" style="margin-top: 10px;">
Back to Main
</button>
<hr />
<!-- Sound Settings -->
<h4>Sound Settings</h4>
<div>
<label>Music On <input type="checkbox" id="musicOnCheckbox" checked /></label>
<input type="range" id="musicVolumeSlider" min="0" max="100" value="100" />
</div>
<div>
<label>SFX On <input type="checkbox" id="sfxOnCheckbox" checked /></label>
<input type="range" id="sfxVolumeSlider" min="0" max="100" value="100" />
</div>
</div>

<!-- RIGHT column: tower stats table -->
<div id="settingsRightColumn" class="settings-right-column">
<div id="debugTableContainer" class="debug-table-container">
<table id="debugTable" class="debug-table">
</table>
</div>
</div>
</div>
</div>

<div id="loseMessage" class="message-dialog">
<h1>You lost</h1>
<div style="font-size:6em;">X</div>
<div style="margin-top:10px;">
<button id="loseRestartBtn" class="action-button" style="margin-right:10px;">Restart</button>
<button id="loseSettingsBtn" class="action-button" style="margin-right:10px;">Settings</button>
<button id="loseMainBtn" class="action-button">Back to main</button>
</div>
</div>

<div id="winMessage" class="message-dialog">
<h1>You win!</h1>
<div id="winStarsEarned" style="margin: 20px 0; display: flex; align-items: center; justify-content: center; gap: 8px;">
  <span style="font-size: 18px; margin-right: 10px;">Stars Earned:</span>
  <div id="winStarDisplay" style="display: flex; gap: 4px;"></div>
</div>
<div style="margin-top:10px;">
<button id="winRestartBtn" class="action-button" style="margin-right:10px;">Restart</button>
<button id="winSettingsBtn" class="action-button" style="margin-right:10px;">Settings</button>
<button id="winMainBtn" class="action-button">Back to main</button>
</div>
</div>

<!-- TOWER BUILD DIALOG -->
<div id="towerBuildDialog" style="
display: none;
position: absolute;
background: rgba(0,0,0,0.85);
border: 2px solid #999;
border-radius: 8px;
z-index: 10000;
padding: 10px;
color: #fff;">
<div id="towerBuildClose" style="float: right; cursor: pointer; margin-bottom: 6px;">&#10006;</div>
<!-- (header removed earlier) -->
<div id="towerBuildOptions" style="display: flex; flex-direction: row; gap: 15px;">
<!-- Populated dynamically -->
</div>
</div>

<!-- TOWER UPGRADE DIALOG -->
<div id="towerUpgradeDialog" class="tower-upgrade-dialog">
<div id="towerUpgradeClose" class="dialog-close" style="align-self: flex-end;">&#10006;</div>
<h2 id="towerUpgradeTitle">Tower L1</h2>
<button id="towerSellBtn" class="btn">Sell Tower</button>
<button id="towerGatherBtn" class="btn">Set Gather Point</button>
<button id="towerUpgradeBtn" class="btn primary">Upgrade $50</button>
</div>

<script type="module">
document.addEventListener("DOMContentLoaded", () => {
// Example logic for hooking up "editorBackToMainBtn"
const btn = document.getElementById("editorBackToMainBtn");
if (btn) {
btn.addEventListener("click", () => {
if (window.hideEditorHub) {
window.hideEditorHub();
}
});
}
});
</script>
</body>
</html>
